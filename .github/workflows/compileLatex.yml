name: Compila LaTeX e Verifica Qualità

on:
  push:
    paths:
      - 'src/**/*.tex'
      - 'src/**/*.jpg'
      - 'src/**/*.png'
      - 'scripts/**/*.py'
      - 'scripts/**/*.txt'
      - 'requirements.txt'
  workflow_dispatch:

jobs:
  build-pdf:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
    - name: Checkout repository
      uses: actions/checkout@v3
      with:
        token: ${{ secrets.GITHUB_TOKEN }}

    # ========================================================
    # 🐍 INIZIO CONTROLLI QUALITÀ (PYTHON)
    # ========================================================
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.x'

    - name: Install Python Dependencies
      run: |
        if [ -f "requirements.txt" ]; then
          echo "📦 Installazione dipendenze Python..."
          pip install -r requirements.txt
        else
          echo "⚠️ Nessun file requirements.txt trovato."
        fi

    - name: 📖 Applica pedice Glossario
      run: |
        if [ -f "scripts/glossario.py" ]; then
          echo "🔤 Applicazione pedice G alle parole del glossario..."
          python scripts/glossario.py
        else
          echo "⚠️ Script scripts/glossario.py non trovato, salto."
        fi

    - name: 🔎 Check Spelling (Ortografia)
      run: |
        if [ -f "scripts/spellcheck.py" ]; then
          echo "🔤 Avvio controllo ortografico..."
          python scripts/spellcheck.py
        else
          echo "⚠️ Script scripts/spellcheck.py non trovato, salto."
        fi

    - name: 📖 Check Gulpease (Leggibilità)
      run: |
        if [ -f "scripts/gulpease.py" ]; then
          echo "📊 Avvio calcolo Indice di Gulpease..."
          python scripts/gulpease.py
        else
          echo "⚠️ Script scripts/gulpease.py non trovato, salto."
        fi
    # ========================================================
    # 🏁 FINE CONTROLLI QUALITÀ
    # ========================================================

    - name: Install LaTeX
      run: |
        echo "⬇️ Installazione pacchetti LaTeX in corso..."
        sudo apt-get update
        sudo apt-get install -y \
          texlive-latex-base \
          texlive-latex-extra \
          texlive-lang-italian \
          latexmk

    - name: Compile ALL LaTeX files
      run: |
        # Crea cartelle di destinazione
        mkdir -p 1_Candidatura 2_RTB 3_PB Verbali_interni Verbali_esterni Documenti_interni
        
        echo "=== 📂 STRUTTURA INIZIALE ==="
        find src -name "*.tex" | head -5
        
        # Trova e compila TUTTI i file .tex in src/
        find src -name "*.tex" -type f | while read texfile; do
          echo "---------------------------------------------------"
          echo "🔨 Compilando: $texfile"
          
          # Estrai cartella e nome file
          dir=$(dirname "$texfile")
          filename=$(basename "$texfile" .tex)
          
          # ORDINE IMPORTANTE: dai più specifico al più generale
          if [[ "$texfile" == *"src/Verbali_interni"* ]]; then
            dest="Verbali_interni" 
            echo "📁 TROVATO: Verbale interno"
          elif [[ "$texfile" == *"src/Verbali_esterni"* ]]; then
            dest="Verbali_esterni" 
            echo "📁 TROVATO: Verbale esterno"
          elif [[ "$texfile" == *"src/1_Candidatura"* ]]; then
            dest="1_Candidatura"
            echo "📁 TROVATO: Documento candidatura"
          elif [[ "$texfile" == *"src/2_RTB"* ]]; then
            dest="2_RTB" 
            echo "📁 TROVATO: Documento RTB"
          elif [[ "$texfile" == *"src/3_PB"* ]]; then
            dest="3_PB" 
            echo "📁 TROVATO: Documento PB"
          elif [[ "$texfile" == *"src/Documenti_interni"* ]]; then
            dest="Documenti_interni" 
            echo "📁 TROVATO: Documento interno"
          else
            # Se non è in una cartella specifica, mettilo in Documenti_interni
            dest="Documenti_interni"
            echo "📁 DEFAULT: Messo in Documenti_interni"
          fi
          
          echo "📍 Cartella sorgente: $dir"
          echo "🎯 Destinazione PDF: $dest/"
          echo "📄 Nome file: $filename"
          
          # Entra nella cartella e compila
          cd "$dir"
          
          # Compila
          latexmk -pdf -interaction=nonstopmode "$filename.tex"
          
          # Copia il PDF
          if [ -f "$filename.pdf" ]; then
            echo "📋 Copiando $filename.pdf in ../../$dest/"
            cp -v "$filename.pdf" "../../$dest/"
            echo "✅ PDF copiato con successo"
          else
            echo "❌ ERRORE: $filename.pdf non esiste dopo la compilazione"
            ls -la
          fi
          
          cd ../..
        done
        
        echo "=== 📑 FILE FINALI GENERATI ==="
        echo "Candidatura/:"
        ls -la 1_Candidatura/ 2>/dev/null || echo "Vuota"
        echo "RTB/:"
        ls -la 2_RTB/ 2>/dev/null || echo "Vuota"
        echo "PB/:"
        ls -la 3_PB/ 2>/dev/null || echo "Vuota"
        echo "Verbali_interni/:"
        ls -la Verbali_interni/ 2>/dev/null || echo "Vuota"
        echo "Verbali_esterni/:"
        ls -la Verbali_esterni/ 2>/dev/null || echo "Vuota"
        echo "Documenti_interni/:"
        ls -la Documenti_interni/ 2>/dev/null || echo "Vuota"

    - name: Commit PDFs e .tex modificati
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        git config --global user.name "github-actions"
        git config --global user.email "github-actions@github.com"
        
        echo "📝 Verifica file da committare..."
        git status --porcelain
        
        # Aggiunge sia i PDF generati che i .tex modificati dallo script glossario
        git add 1_Candidatura/ 2_RTB/ 3_PB/ Verbali_interni/ Verbali_esterni/ Documenti_interni/ src/
        
        if git diff --staged --quiet; then
          echo "Nessun file nuovo da committare"
        else
          git commit -m "Auto-generate PDFs + applica glossario [skip actions]"
          git push
          echo "✅ Commit e push completati"
        fi