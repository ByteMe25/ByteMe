name: Compila LaTeX

on:
  push:
    paths:
      - 'src/**/*.tex'
      - 'src/**/*.jpg'
      - 'src/**/*.png'
  workflow_dispatch:

jobs:
  build-pdf:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
    - name: Checkout repository
      uses: actions/checkout@v3
      with:
        token: ${{ secrets.GITHUB_TOKEN }}

    - name: Install LaTeX
      run: |
        sudo apt-get update
        sudo apt-get install -y \
          texlive-latex-base \
          texlive-latex-extra \
          texlive-lang-italian \
          latexmk

    - name: Compile ALL LaTeX files
      run: |
        # Crea cartelle di destinazione
        mkdir -p Candidatura Verbali
        
        echo "=== STRUTTURA INIZIALE ==="
        find src -name "*.tex" | head -5
        
        # Trova e compila TUTTI i file .tex in src/
        find src -name "*.tex" -type f | while read texfile; do
          echo "🔨 Compilando: $texfile"
          
          # Estrai cartella e nome file
          dir=$(dirname "$texfile")
          filename=$(basename "$texfile" .tex)
          
          # Determina dove mettere il PDF
          # Controllo ESPLICITO dei percorsi
          if [[ "$texfile" == *"src/Candidatura"* ]]; then
            dest="Candidatura"
            echo "📁 TROVATO: Documento candidatura"
          elif [[ "$texfile" == *"src/Verbali"* ]]; then
            dest="Verbali" 
            echo "📁 TROVATO: Verbale"
          else
            # Se non è in una cartella specifica, mettilo in Candidatura
            dest="Verbali"
            echo "📁 DEFAULT: Messo in Verbali"
          fi
          
          echo "📁 Cartella sorgente: $dir"
          echo "📁 Destinazione PDF: $dest/"
          echo "📄 Nome file: $filename"
          
          # Entra nella cartella e compila
          cd "$dir"
          echo "📍 Directory corrente: $(pwd)"
          
          # Compila
          latexmk -pdf -interaction=nonstopmode "$filename.tex"
          
          # DEBUG: Cosa c'è nella cartella dopo la compilazione?
          echo "📂 Contenuto cartella dopo compilazione:"
          ls -la *.pdf 2>/dev/null || echo "Nessun PDF trovato"
          
          # Copia il PDF
          if [ -f "$filename.pdf" ]; then
            echo "📋 Copiando $filename.pdf in ../../$dest/"
            cp -v "$filename.pdf" "../../$dest/"  # -v per vedere se funziona
            echo "✅ PDF copiato in: $dest/$filename.pdf"
          else
            echo "❌ ERRORE: $filename.pdf non esiste dopo la compilazione"
            ls -la  # Mostra tutti i file per debug
          fi
          
          cd ../..
          echo "---"
        done
        
        echo "=== FILE FINALI ==="
        echo "Candidatura/:"
        ls -la Candidatura/ 2>/dev/null || echo "Vuota"
        echo "Verbali/:"
        ls -la Verbali/ 2>/dev/null || echo "Vuota"

    - name: Commit PDFs
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        git config --global user.name "github-actions"
        git config --global user.email "github-actions@github.com"
        
        echo "📝 File da committare:"
        git status --porcelain
        
        git add Candidatura/ Verbali/
        
        if git diff --staged --quiet; then
          echo "📝 Nessun PDF nuovo da committare"
        else
          git commit -m "Auto-generate PDFs [skip actions]"
          git push
          echo "✅ PDFs committati"
        fi
