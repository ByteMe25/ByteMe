name: Compila LaTeX

on:
  push:
    branches: [ main ]   
  workflow_dispatch:      

jobs:
  build-pdf:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
    - name: Checkout repository
      uses: actions/checkout@v3

    - name: Install lightweight LaTeX
      run: |
        sudo apt-get update
        sudo apt-get install -y \
          texlive-latex-base \
          texlive-latex-recommended \
          texlive-latex-extra \
          texlive-fonts-recommended \
          texlive-fonts-extra \
          texlive-lang-italian \
          texlive-pictures \
          latexmk

    # ======================
    # Compila verbali esterni e interni
    # ======================
    - name: Compile verbali PDFs
      run: |
        mkdir -p "$GITHUB_WORKSPACE/Verbali/Esterni" "$GITHUB_WORKSPACE/Verbali/Interni"

        # 🔹 Compila verbali esterni (2 volte per l'indice)
        for file in "$GITHUB_WORKSPACE"/src/Verbali/Esterni/*.tex; do
          [ -e "$file" ] || continue
          name=$(basename "$file" .tex)
          echo "🧩 Compilo $file → Verbali/Esterni/${name}.pdf"
          cd "$(dirname "$file")"
          # PRIMA compilazione
          pdflatex -interaction=nonstopmode -halt-on-error \
            -output-directory "$GITHUB_WORKSPACE/Verbali/Esterni" "$name.tex"
          # SECONDA compilazione per generare l'indice
          pdflatex -interaction=nonstopmode -halt-on-error \
            -output-directory "$GITHUB_WORKSPACE/Verbali/Esterni" "$name.tex"
          cd "$GITHUB_WORKSPACE"
        done

        # 🔹 Compila verbali interni (2 volte per l'indice)
        for file in "$GITHUB_WORKSPACE"/src/Verbali/Interni/*.tex; do
          [ -e "$file" ] || continue
          name=$(basename "$file" .tex)
          echo "🧩 Compilo $file → Verbali/Interni/${name}.pdf"
          cd "$(dirname "$file")"
          # PRIMA compilazione
          pdflatex -interaction=nonstopmode -halt-on-error \
            -output-directory "$GITHUB_WORKSPACE/Verbali/Interni" "$name.tex"
          # SECONDA compilazione per generare l'indice
          pdflatex -interaction=nonstopmode -halt-on-error \
            -output-directory "$GITHUB_WORKSPACE/Verbali/Interni" "$name.tex"
          cd "$GITHUB_WORKSPACE"
        done

    # ======================
    # Compila le candidature
    # ======================
    - name: Compile candidature PDFs
      run: |
        mkdir -p "$GITHUB_WORKSPACE/Candidatura"
        for file in "$GITHUB_WORKSPACE"/src/Candidatura/*.tex; do
          [ -e "$file" ] || continue
          name=$(basename "$file" .tex)
          echo "🧩 Compilo $file → Candidatura/${name}.pdf"
          cd "$(dirname "$file")"
          # PRIMA compilazione
          pdflatex -interaction=nonstopmode -halt-on-error \
            -output-directory "$GITHUB_WORKSPACE/Candidatura" "$name.tex"
          # SECONDA compilazione per generare l'indice
          pdflatex -interaction=nonstopmode -halt-on-error \
            -output-directory "$GITHUB_WORKSPACE/Candidatura" "$name.tex"
          cd "$GITHUB_WORKSPACE"
        done
        
    # ======================
    # 🧹 Pulisce i file temporanei
    # ======================
    - name: Clean auxiliary LaTeX files
      run: |
        echo "🧹 Pulizia file temporanei (.aux, .log, .out)..."
        cd "$GITHUB_WORKSPACE"
        find Verbali Candidatura -type f \( -name "*.aux" -o -name "*.log" -o -name "*.out" -o -name "*.toc" \) -delete
        echo "✅ Pulizia completata"

    # ======================
    # 🔍 Debug (opzionale)
    # ======================
    - name: Debug output files
      run: |
        echo "=== PDF generati ==="
        find "$GITHUB_WORKSPACE" -type f -name "*.pdf" | sort || echo "⚠️ Nessun PDF trovato"

    # ======================
    # Commit e push dei PDF
    # ======================
    - name: Commit compiled PDFs
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        git config --global user.name "github-actions"
        git config --global user.email "github-actions@github.com"

        echo "📦 Aggiungo eventuali PDF generati..."
        git add -A Verbali Candidatura

        echo "💬 Commetto se ci sono modifiche..."
        git commit -m "Aggiorna PDF compilati" || echo "Nessuna modifica da committare"

        echo "🚀 Push verso il branch corrente..."
        git push || echo "⚠️ Nessun push eseguito"
